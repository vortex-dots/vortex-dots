env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = QSG_RHI_BACKEND,vulkan

exec_once = dms run
exec_once = swaybg -c "#1e1e2e"

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
shadows=1
border_radius=12
animations=1
gap_outer_horizontal=15
gap_outer_vertical=15
gap_inner_horizontal=10
gap_inner_vertical=10  

monitor_rule=name:DP-1, width:2560, height:1440, refresh:165, x:0, y:0, scale:1.0

bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad
bind=SUPER,E,spawn,nautilus
bind=SUPER,D,spawn,dms ipc call launcher toggle
bind=ALT,F4,killclient
bind=SUPER,T,spawn,kitty
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER,U,spawn_shell,msnap shot -r

xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle

# DMS Include Configs
source=./dms/outputs.conf
